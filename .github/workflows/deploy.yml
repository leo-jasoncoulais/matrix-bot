name: Test and Deploy

on:
  push:
    branches: master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run main.py and check output
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          timeout 10 python -u main.py > output.txt 2>&1 || EXIT_CODE=$?
          if [ "${EXIT_CODE}" != "" ] && [ "${EXIT_CODE}" != "124" ]; then
            echo "❌ main.py crashed with exit code ${EXIT_CODE}"
            cat output.txt
            exit 1
          fi
          OUTPUT=$(cat output.txt)
          echo "Full output:"
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Bot en écoute..."; then
            echo "✅ Test passed"
          else
            echo "❌ Test failed"
            exit 1
          fi
  
  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Setup WG key
      run: |
        sudo apt update -y
        sudo apt install wireguard resolvconf -y
        echo "[Interface]
            Address = 172.30.0.254/32
            PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
            MTU = 1400

            [Peer]
            PublicKey = 94bSX0kAhx7YxuXAnBRu2n8sMZw1vn7yaj8w3nf+8Hk=
            PresharedKey = ${{ secrets.WG_PRESHARED_KEY }}
            AllowedIPs = 172.30.0.0/24
            Endpoint = ${{ secrets.WG_ENDPOINT }}
            PersistentKeepalive = 15" | sudo tee /etc/wireguard/wg0.conf
        wg-quick up wg0

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy
      run: |
        ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd /home/${{ secrets.SSH_USER }}/matrix-bot
            eval $(ssh-agent -s) >/dev/null 2>&1
            ssh-add /home/${{ secrets.SSH_USER }}/.ssh/github_key
            git pull origin master
            docker compose stop
            docker compose up -d --build --force-recreate
        EOF
